[reference_host]
provider = "aws"
instance_type = "m7a.xlarge"
architecture = "x86_64"
os_id = "ubuntu"
os_version = "24.04"

[collection]
run_timeout_minutes = 420
memory_limit_gib = 12

[[comparisons]]
