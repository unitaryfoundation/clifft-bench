suite_version = "0.3.0"
profile_id = "release-v1"
title = "Recurring single-core Clifft release benchmark"
classification = "official"
seed = 20260819
hardware_epoch = "aws-m7a-xlarge-ubuntu2404-v1"
workloads_file = "../workloads.toml"
software_file = "../software.toml"

[reference_host]
provider = "aws"
instance_type = "m7a.xlarge"
architecture = "x86_64"
os_id = "ubuntu"
os_version = "24.04"

[collection]
run_timeout_minutes = 420
memory_limit_gib = 12

