suite_version = "0.3.0"
profile_id = "release-v1"
title = "Clifft and peer CPU release matrix"
classification = "official"
seed = 20260819
hardware_epoch = "aws-m7a-4xlarge-ubuntu2404-v1"
workloads_file = "../workloads.toml"
software_file = "../software.toml"

[reference_host]
provider = "aws"
instance_type = "m7a.4xlarge"
architecture = "x86_64"
os_id = "ubuntu"
os_version = "24.04"

[collection]
run_timeout_minutes = 420
memory_limit_gib = 32

[resources]

[measurement]
setup_timeout_seconds = 1800
request_timeout_seconds = 1800
correctness_shots = 8
min_sample_seconds = 15
repetitions = 3

[[comparisons]]
id = "current-vs-previous"
baseline_variant = "clifft-previous"
candidate_variants = ["clifft-current"]

[[comparisons]]
id = "peers-vs-current"
baseline_variant = "clifft-current"
candidate_variants = ["tsim-current", "xtim-current", "symft-current", "stim-current"]

[[comparisons]]
id = "peers-vs-current-off"
baseline_variant = "clifft-current-off"
candidate_variants = ["tsim-current-off", "xtim-current-off", "symft-current-off", "stim-current-off"]

[[comparisons]]
id = "current-vs-previous-8c"
baseline_variant = "clifft-previous-8c"
candidate_variants = ["clifft-current-8c"]

[[comparisons]]
id = "peers-vs-current-8c"
baseline_variant = "clifft-current-8c"
candidate_variants = ["tsim-current-8c", "xtim-current-8c", "symft-current-8c", "stim-current-8c"]

[[comparisons]]
id = "peers-vs-current-off-8c"
baseline_variant = "clifft-current-off-8c"
candidate_variants = ["tsim-current-off-8c", "xtim-current-off-8c", "symft-current-off-8c", "stim-current-off-8c"]

[[variants]]
id = "clifft-previous"
implementation_id = "clifft-0.13.0"
workloads = "previous-clifft-survivors"

[variants.execution]
postselect = "on"
threads = 1
batch_size = "auto"
options_preset = "clifft-scheduled"

