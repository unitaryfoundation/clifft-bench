[project]
name = "clifft-qv-experiment"
version = "0.1.0"
description = "Standalone Quantum Volume paper refresh for Clifft"
requires-python = ">=3.12,<3.14"
dependencies = [
    "clifft @ git+https://github.com/unitaryfoundation/clifft.git@87175b513b8d944955102230b9c7931be1570ef2",
    "numpy==2.5.2",
    "ply==3.11",
    "pyqrack==2.19.3",
    "qiskit==2.5.2",
    "qiskit-aer==0.17.2",
    "qiskit-qrack-provider==1.12.0",
    "qsimcirq==0.22.1",
    "qulacs==0.6.14",
]

[project.optional-dependencies]
plot = ["matplotlib==3.11.1"]
test = ["pytest==9.1.1"]

[tool.uv]
package = false
config-settings-package = { clifft = { "cmake.define.CLIFFT_MAX_QUBITS" = "64", "cmake.define.CLIFFT_OPENMP" = "ON" } }
extra-build-variables = { clifft = { CLIFFT_CPU_BASELINE = "native" } }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
