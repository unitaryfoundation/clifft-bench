[project]
name = "clifft-bench-whole-machine"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "clifft==0.10.0rc1",
    "symft",
    "stim==1.16.0",
    "bloqade-tsim",
    "jax==0.11.1",
    "jaxlib==0.11.1",
    "numpy==2.5.2",
    "pyzx-param==0.9.3",
    "jsonschema>=4.23",
    "psutil>=7",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9"]

[tool.uv.sources]
symft = { git = "https://github.com/haoliri0/SOFT.git", rev = "c89b98514a919240b8afa53a271e08d926d3c987", subdirectory = "python" }
bloqade-tsim = { git = "https://github.com/QuEraComputing/tsim.git", rev = "44f64ba79c91e6ada77d6b609595ad0a3d767c11" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: exercises installed simulators on small circuits"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
