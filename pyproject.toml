[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "clifft-bench"
version = "0.1.0"
description = "Reproducible CPU benchmarks for near-Clifford quantum simulators"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Unitary Foundation" }]
dependencies = ["jsonschema>=4.23"]

[project.optional-dependencies]
test = [
    "numpy>=2.0",
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
clifft-bench = "clifft_bench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
