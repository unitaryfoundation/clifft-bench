name: Larger runner A/A study

on:
  workflow_dispatch:
    inputs:
      min_sample_seconds:
        description: Minimum wall time for each raw sample
        required: true
        default: "30"
        type: string
      repetitions:
        description: Alternating A/B repetitions per workload
        required: true
        default: "6"
        type: string
      replica_count:
        description: Independent jobs (use one only for commissioning)
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"

permissions:
  contents: read

concurrency:
  group: larger-runner-aa-study
  cancel-in-progress: false

jobs:
  github-larger:
    name: GitHub larger runner replica ${{ matrix.replica }}
    runs-on: ucc-benchmarks-8-core-U22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Keep replicas serial even if the organization pool is later expanded.
      max-parallel: 1
      matrix:
        replica: ${{ fromJSON(inputs.replica_count == '1' && '[1]' || '[1,2,3]') }}
    env:
      RESULT_PREFIX: results/larger-runner-aa-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replica }}
      STUDY_MIN_SAMPLE_SECONDS: ${{ inputs.min_sample_seconds || '30' }}
      STUDY_REPETITIONS: ${{ inputs.repetitions || '6' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . -r requirements/runner-study.txt
      - run: clifft-bench validate manifests/run-runner-aa.v1.json
      - name: Collect A/A measurements
        id: collect
        continue-on-error: true
        run: >-
          clifft-bench run
          --run-manifest manifests/run-runner-aa.v1.json
          --min-sample-seconds "$STUDY_MIN_SAMPLE_SECONDS"
          --repetitions "$STUDY_REPETITIONS"
          --output "$RESULT_PREFIX-raw.json"
      - name: Validate the raw result
        if: always() && hashFiles('results/*-raw.json') != ''
        run: clifft-bench validate "$RESULT_PREFIX-raw.json"
      - name: Summarize this replica
        if: always() && hashFiles('results/*-raw.json') != ''
        run: >-
          clifft-bench analyze-aa "$RESULT_PREFIX-raw.json"
          --output-json "$RESULT_PREFIX-summary.json"
          --output-csv "$RESULT_PREFIX-pairs.csv"
      - name: Upload raw result and derived summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: larger-runner-aa-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replica }}
          path: results/larger-runner-aa-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replica }}*
          if-no-files-found: error
          retention-days: 90
      - name: Preserve a collection failure after uploading diagnostics
        if: always() && steps.collect.outcome == 'failure'
        run: exit 1
