name: Runner A/A study

on:
  # Temporary twice-daily collection window for issue #4. Remove this schedule
  # when the initial evidence set has been collected.
  schedule:
    # GitHub identifies the start of each hour as a high-load period.
    - cron: "17 1,13 * * *"
  workflow_dispatch:
    inputs:
      min_sample_seconds:
        description: Minimum wall time for each raw sample
        required: true
        default: "30"
        type: string
      repetitions:
        description: Alternating A/B repetitions per workload
        required: true
        default: "6"
        type: string

permissions:
  contents: read

concurrency:
  group: runner-aa-study
  cancel-in-progress: false

jobs:
  github-hosted:
    name: GitHub-hosted replica ${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    env:
      RESULT_PREFIX: results/runner-aa-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replica }}
      STUDY_MIN_SAMPLE_SECONDS: ${{ inputs.min_sample_seconds || '30' }}
      STUDY_REPETITIONS: ${{ inputs.repetitions || '6' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . 'clifft==0.7.0'
      - run: clifft-bench validate manifests/run-runner-aa.v1.json
      - name: Collect A/A measurements
        id: collect
        continue-on-error: true
        run: >-
          clifft-bench run
          --run-manifest manifests/run-runner-aa.v1.json
          --min-sample-seconds "$STUDY_MIN_SAMPLE_SECONDS"
          --repetitions "$STUDY_REPETITIONS"
          --output "$RESULT_PREFIX-raw.json"
      - name: Validate the raw result
        if: always() && hashFiles('results/*-raw.json') != ''
        run: clifft-bench validate "$RESULT_PREFIX-raw.json"
      - name: Summarize this replica
        if: always() && hashFiles('results/*-raw.json') != ''
        run: >-
          clifft-bench analyze-aa "$RESULT_PREFIX-raw.json"
          --output-json "$RESULT_PREFIX-summary.json"
          --output-csv "$RESULT_PREFIX-pairs.csv"
      - name: Upload raw result and derived summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-aa-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replica }}
          path: results/runner-aa-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replica }}*
          if-no-files-found: error
          retention-days: 90
      - name: Preserve a collection failure after uploading diagnostics
        if: always() && steps.collect.outcome == 'failure'
        run: exit 1
