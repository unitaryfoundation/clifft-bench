name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: pytest
      - run: ruff check .
      - name: Verify self-contained wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir "${{ runner.temp }}/clifft-bench-wheel"
          python -m venv "${{ runner.temp }}/clifft-bench-wheel-venv"
          "${{ runner.temp }}/clifft-bench-wheel-venv/bin/pip" install \
            "${{ runner.temp }}/clifft-bench-wheel/"*.whl
          cd "${{ runner.temp }}"
          "${{ runner.temp }}/clifft-bench-wheel-venv/bin/clifft-bench" validate

  adapter-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . 'clifft==0.7.0'
      - run: python -m pip install 'git+https://github.com/haoliri0/SymFT_Test.git@9ec5790322f93140e78bdb6d6620a2a43eceba0b#subdirectory=python'
      - run: clifft-bench run --min-sample-seconds 0.01 --repetitions 1 --output /tmp/adapter-smoke.json
      - run: clifft-bench validate /tmp/adapter-smoke.json
