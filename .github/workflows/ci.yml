name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[plot,test]'
      - run: pytest
      - run: ruff check .
      - run: python scripts/plot_qv.py --output-base /tmp/qv-performance

  adapter-smoke:
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "true"
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]' 'clifft==0.9.0' 'bloqade-tsim==0.1.5'
      - run: python -m pip install 'git+https://github.com/haoliri0/SymFT_Test.git@9ec5790322f93140e78bdb6d6620a2a43eceba0b#subdirectory=python'
      - run: python -m pytest tests/test_reference_convention.py
      - run: clifft-bench run --min-sample-seconds 0.01 --repetitions 1 --output /tmp/adapter-smoke.json
      - run: clifft-bench validate /tmp/adapter-smoke.json

  historical-clifft-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]' 'clifft==0.1.0'
      - run: python -m pytest tests/test_reference_convention.py -k clifft

  qv-adapter-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated QV environments
        run: |
          set -euo pipefail
          for environment in \
            generator-paper \
            qiskit-2.5.2-aer-0.17.2 \
            qulacs-0.6.14 \
            qsimcirq-0.22.0; do
            python -m venv "/tmp/qv-$environment"
            "/tmp/qv-$environment/bin/python" -m pip install --upgrade pip
            "/tmp/qv-$environment/bin/python" -m pip install \
              --no-deps -r "environments/qv-$environment.txt"
            "/tmp/qv-$environment/bin/python" -m pip check
          done
          python -m venv /tmp/qv-clifft-0.9.0
          /tmp/qv-clifft-0.9.0/bin/python -m pip install --upgrade pip
          CLIFFT_CPU_BASELINE=native \
            /tmp/qv-clifft-0.9.0/bin/python -m pip install --no-deps \
              --config-settings cmake.define.CLIFFT_MAX_QUBITS=64 \
              --config-settings cmake.define.CLIFFT_OPENMP=ON \
              -r environments/qv-clifft-0.9.0.txt
          /tmp/qv-clifft-0.9.0/bin/python -m pip check
      - name: Run one case per QV adapter
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          cpu="$(python -c 'import os; print(min(os.sched_getaffinity(0)))')"
          /tmp/qv-generator-paper/bin/python \
            -m clifft_bench.qv_worker generate \
            --qubits 6 --seed 42 --output /tmp/qv6.qasm
          for adapter_environment in \
            qiskit:qiskit-2.5.2-aer-0.17.2 \
            qulacs:qulacs-0.6.14 \
            qsim:qsimcirq-0.22.0 \
            clifft:clifft-0.9.0; do
            adapter="${adapter_environment%%:*}"
            environment="${adapter_environment#*:}"
            "/tmp/qv-$environment/bin/python" -m clifft_bench.qv_worker run \
              --adapter "$adapter" --qasm /tmp/qv6.qasm \
              --threads 1 --cpu-set "$cpu" --memory-limit-gib 10
          done
