name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,report]'
      - run: pytest tests
      - run: ruff check .
      - run: clifft-bench validate

  adapter-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - name: Identify native build cache
        id: native-cache
        run: |
          echo "path=$(python -m pip cache dir)" >> "$GITHUB_OUTPUT"
          fingerprint=$({ g++ --version; g++ -march=native -Q --help=target; } | sha256sum | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.native-cache.outputs.path }}
          # SymFT uses -march=native. Reuse wheels only for the same compiler,
          # CPU target, Python, dependencies, and workflow build settings.
          # No fallback restore key: it could restore an incompatible native wheel.
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ steps.python.outputs.python-version }}-${{ steps.native-cache.outputs.fingerprint }}-${{ hashFiles('pyproject.toml', 'environments/*.txt', '.github/workflows/ci.yml') }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - name: Install the previous Clifft release
        run: python -m pip install --no-deps -r environments/clifft-0.12.0rc1.txt
      - run: python -m pip check
      - name: Check previous Clifft correctness and bounded calibration
        run: python -m pytest tests/test_reference_convention.py -k clifft
      - name: Install current pinned SymFT
        env:
          SYMFT_PY_NATIVE: "1"
          SYMFT_PY_ENABLE_CUDA: "0"
        run: python -m pip install --no-deps -r environments/symft-0.1.1-c89b985.txt
      - run: python -m pip check
      - name: Install pinned portable xtim
        env:
          QECCORE_PORTABLE: "1"
          CXXFLAGS: "-include cstdint"
        run: python -m pip install --no-deps -r environments/xtim-3.2.2-edf0dd0.txt
      - run: python -m pip check
      - run: python -m pytest tests/test_reference_convention.py tests/test_symft_adapter.py tests/test_stim_adapter.py tests/test_xtim_adapter.py tests/test_distillation_15to1.py tests/test_code_switching.py
      - run: python -m pytest tests/test_workload_coverage.py -k 'not clifft'
      - run: python -m pytest tests/test_runner.py -k symft
      - run: clifft-bench run --python "$(command -v python)" --case 'symft|xtim|stim' --min-sample-seconds 0.01 --repetitions 1 --output-dir /tmp/adapter-smoke
      - run: clifft-bench validate /tmp/adapter-smoke/raw.json
      - run: clifft-bench run --python "$(command -v python)" campaigns/coverage-smoke.toml --case 'symft|xtim|stim' --memory-limit-gib 12 --output-dir /tmp/coverage-peers
      - run: clifft-bench validate /tmp/coverage-peers/raw.json
      - name: Validate bulk SymFT calibration under the memory ceiling
        timeout-minutes: 5
        run: clifft-bench run --python "$(command -v python)" campaigns/tsim-pilot.toml --case symft-bulk --min-sample-seconds 0.01 --repetitions 1 --memory-limit-gib 12 --output-dir /tmp/bulk-symft-pilot
      - run: clifft-bench validate /tmp/bulk-symft-pilot/raw.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-pilot-symft
          path: |
            /tmp/bulk-symft-pilot/raw.json
            /tmp/coverage-peers/raw.json

  tsim-cpu:
    runs-on: ubuntu-latest
    env:
      NUMBA_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-deps -r environments/tsim-0.1.5-e9406ed.txt
      - run: python -m pip install -e '.[test]'
      - run: python -m pip check
      - run: python -m pytest tests/test_tsim_adapter.py tests/test_reference_convention.py tests/test_distillation_15to1.py tests/test_runner.py tests/test_code_switching.py tests/test_workload_coverage.py -k 'tsim or hamming'
      - run: clifft-bench run --python "$(command -v python)" campaigns/tsim-smoke.toml --min-sample-seconds 0.01 --repetitions 1 --memory-limit-gib 12 --output-dir /tmp/tsim-smoke
      - run: clifft-bench validate /tmp/tsim-smoke/raw.json
      - run: clifft-bench run --python "$(command -v python)" campaigns/coverage-smoke.toml --case 'tsim' --memory-limit-gib 12 --output-dir /tmp/coverage-tsim
      - run: clifft-bench validate /tmp/coverage-tsim/raw.json
      - name: Validate bulk Tsim calibration under the memory ceiling
        timeout-minutes: 5
        run: clifft-bench run --python "$(command -v python)" campaigns/tsim-pilot.toml --case tsim-bulk --min-sample-seconds 0.01 --repetitions 1 --memory-limit-gib 12 --output-dir /tmp/bulk-tsim-pilot
      - run: clifft-bench validate /tmp/bulk-tsim-pilot/raw.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-pilot-tsim
          path: |
            /tmp/bulk-tsim-pilot/raw.json
            /tmp/coverage-tsim/raw.json

  clifft-current:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r environments/clifft-0.13.0rc2.txt -e '.[test]'
      - name: Check current adapter and circuit correctness
        run: |
          ulimit -v 12582912
          python -m pytest tests/test_adapters.py tests/test_reference_convention.py tests/test_code_switching.py tests/test_workload_coverage.py
      - name: Run current Clifft smoke cases
        run: clifft-bench run --python "$(command -v python)" --case clifft --min-sample-seconds 0.01 --repetitions 1 --memory-limit-gib 12 --output-dir /tmp/clifft-smoke
      - run: clifft-bench validate /tmp/clifft-smoke/raw.json
      - run: clifft-bench run --python "$(command -v python)" campaigns/coverage-smoke.toml --case 'clifft' --memory-limit-gib 12 --output-dir /tmp/coverage-clifft
      - run: clifft-bench validate /tmp/coverage-clifft/raw.json
      - name: Validate bulk Clifft calibration under the memory ceiling
        timeout-minutes: 5
        run: clifft-bench run --python "$(command -v python)" campaigns/tsim-pilot.toml --case clifft-bulk --min-sample-seconds 0.01 --repetitions 1 --memory-limit-gib 12 --output-dir /tmp/bulk-clifft-pilot
      - run: clifft-bench validate /tmp/bulk-clifft-pilot/raw.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-clifft-smoke
          path: |
            /tmp/clifft-smoke/raw.json
            /tmp/bulk-clifft-pilot/raw.json
            /tmp/coverage-clifft/raw.json
