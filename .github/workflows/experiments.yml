name: Experiments

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/**'
      - '!experiments/**/*.md'
      - 'workloads.toml'
      - 'workloads/circuits/**'
      - '.github/workflows/experiments.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/**'
      - '!experiments/**/*.md'
      - 'workloads.toml'
      - 'workloads/circuits/**'
      - '.github/workflows/experiments.yml'

jobs:
  qv-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest experiments/qv/tests

  tsim-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            experiments/tsim-gpu/pyproject.toml
            experiments/tsim-gpu/uv.lock
      - run: uv sync --project experiments/tsim-gpu --locked --python 3.12 --extra test
      - name: Validate pinned Tsim API and experiment workflow on CPU
        working-directory: experiments/tsim-gpu
        env:
          JAX_PLATFORMS: cpu
        run: .venv/bin/python -m pytest -q

